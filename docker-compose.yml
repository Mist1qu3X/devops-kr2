name: kr2

services:
  app:
    build: .
    image: kr2-app:1.0
    restart: unless-stopped
    # секрет REDIS_PASSWORD — только из .env на сервере
    env_file: .env
    # несекретные параметры
    environment:
      REDIS_HOST: redis
      STUDENT: Turdakhunov
    ports:
      - "127.0.0.1:8004:8004"
    networks:
      - backend
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is not set}"]
    env_file: .env
    volumes:
      - redis_data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 5

networks:
  backend:

volumes:
  redis_data:
